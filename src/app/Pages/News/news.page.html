<app-header [title]="'NEWS'"></app-header>
<ion-backdrop *ngIf="showSpinner" tappable="false"></ion-backdrop>
<app-loading-spinner *ngIf="showSpinner"></app-loading-spinner>
<ion-content padding>
  <ion-list>
    <ion-item lines="none" button *ngFor="let post of latestPosts" (click)="openNewsStory(post.url)">
      <ion-avatar slot="start">
        <img [src]="post.image" alt="">
      </ion-avatar>
      <ion-label>
        <h3>{{ post.title }}</h3>
        <p> {{ post.url }} </p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
