<ion-content padding>
  <div *ngIf="!fantasyId" class="input-container">
    <ion-item>
      <ion-label position="stacked">
        Enter FPL Id
      </ion-label>
      <ion-input type="number" [(ngModel)]="FplId">
      </ion-input>
    </ion-item>
    <ion-button (click)="onFantasyIdEntered(FplId)" shape="round" color="danger">Enter</ion-button>
  </div>

  <div *ngIf="fantasyId">

    <div class="home__card">
      <div class="home__card__badge">
        <img src="../../assets/Badges/arsenal.png" alt="">
      </div>
      <div class="home__card__name">
        <h6> David Higgins</h6>
        <p>Bank: 102</p>
      </div>
    </div>

    <ion-item-divider>
      <ion-label>
        <ion-text color="danger">
          Transfers:
        </ion-text>
      </ion-label>
    </ion-item-divider>

    <ion-grid class="home__services">
      <ion-row>
        <ion-col size="4" class="home__square" (click)="navigateTo('/team')">
          <ion-icon src="../../assets/icons/soccer-jersey.svg" size="large" color="danger"></ion-icon>
          <ion-label text-wrap>
            Team
          </ion-label>
        </ion-col>
        <ion-col size="4" class="home__square" (click)="navigateTo('/leagues')">
          <ion-icon src=" ../../assets/icons/trophy.svg" size="large" color="danger">
          </ion-icon>
          <ion-label text-wrap>
            Leagues
          </ion-label>
        </ion-col>
        <ion-col size="4" class="home__square" (click)="navigateTo('/news')">
          <ion-icon name="paper" size="large" color="danger"></ion-icon>
          <ion-label text-wrap>
            News
          </ion-label>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>


</ion-content>
