<ion-header>
  <ion-toolbar color="primary">
    <ion-title>
      Leagues
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list lines="full">
    <ion-list-header>
      <ion-label>{{ league_name }}</ion-label>
    </ion-list-header>
    <ion-item *ngFor="let item of items">
      <ion-badge color="none" slot="start">{{item.rank}}</ion-badge>
      <!-- <ion-icon name="{{item.movement}}" slot="start"></ion-icon> -->
      <ion-label text-wrap>
        <ion-text>
          <h2>{{ item.entry_name }}</h2>
        </ion-text>
        <h3>{{ item.player_name }}</h3>
        <ion-badge color="success">{{ item.chip }}</ion-badge>
        <p> Transfers: {{ item.transfers }} </p>
        <p> Transfers cost: {{ item.transferCost }} points</p>
        <p> Captain: <strong>{{ item.captain }}</strong>
        </p>
      </ion-label>
      <ion-note slot="end" text-wrap>
        <ion-text>
          <h6>{{ item.total }}</h6>
        </ion-text>
        <p>
          {{ item.event_total }}
        </p>
      </ion-note>
    </ion-item>
  </ion-list>
</ion-content>
