<app-header [title]="'NEWS'"></app-header>
<ion-backdrop *ngIf="showSpinner" tappable="false"></ion-backdrop>
<app-loading-spinner *ngIf="showSpinner"></app-loading-spinner>
<ion-content padding>
  <ion-list>
    <ion-card *ngFor="let post of latestPosts">
      <a [href]="post.url" class="news-link"></a>
      <ion-img [src]="post.image"></ion-img>
      <ion-card-header>
        <ion-card-title>{{ post.title }}</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <p>
          {{ post.url }}
        </p>
      </ion-card-content>
    </ion-card>
  </ion-list>
</ion-content>
