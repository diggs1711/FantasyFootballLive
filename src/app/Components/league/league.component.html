<ion-header translucent="true">
  <ion-toolbar color="teritary" text-center>
    <ion-label class="main-logo">LEAGUE</ion-label>
    <ion-buttons slot="start">
      <ion-button (click)="closeModal()">
        <ion-icon slot="start" name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-buttons slot="primary">
      <ion-button (click)="refresh(league.id)">
        <ion-icon slot='end' name="refresh"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<app-loading-spinner *ngIf="showSpinner"></app-loading-spinner>

<ion-content *ngIf="!showSpinner">
  <ion-refresher slot="fixed" (ionRefresh)="refreshPulldown($event)">
    <ion-refresher-content refreshingSpinner="circles" refreshingText="Refreshing..."></ion-refresher-content>
  </ion-refresher>

  <ion-list inset lines="none" *ngIf="league.members.length > 0">
    <ion-list-header>
      <ion-label text-wrap>
        <h3>
          {{ league.name }}
        </h3>
      </ion-label>
    </ion-list-header>
    <ion-item detail class="league__member" *ngFor="let member of league.members; let i = index;" (click)="playerSelected(member.team.id)">
      <div class="rank__number">
        {{ i + 1 }}
      </div>
      <ion-label text-wrap>
        <h6>{{ member.team.name }}
        </h6>
        <p>{{ member.name }}</p>
        <p>
          <ion-text color="danger">
            {{ member.team.overallPoints }}
          </ion-text>
        </p>
        <ion-badge size="small" color="danger">{{ member.activeChip }}</ion-badge>
      </ion-label>

      <ion-note class="league__member__details" slot="end">
        <ion-text *ngIf="member.gameweekTransfers > 0"> {{ member.gameweekTransfers }} Transfer<ion-text *ngIf="member.gameweekTransfers > 1">s</ion-text>
        </ion-text>
        <ion-text color="danger" *ngIf="member.gameweekTransfersCost > 0">
          (-{{ member.gameweekTransfersCost }})</ion-text>
        <p>
          <strong>{{ member.team.captain }} (C)</strong>
        </p>
        <p>
          {{ member.team.gameweekPoints }}
        </p>
      </ion-note>
    </ion-item>
  </ion-list>
</ion-content>
