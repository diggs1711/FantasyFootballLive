<ion-content padding>
  <ion-item lines="none">
    <ion-range [(ngModel)]="fixtureRange" step="1" snaps="true" value="6" pin="true" min="1" max="10" color="danger">
      <ion-label slot="end">10</ion-label>
      <ion-label slot="start">1</ion-label>
    </ion-range>
  </ion-item>
  <!-- <ion-item>
        <ion-label>Rank Teams</ion-label>
        <ion-toggle (ionChange)="rankTeams()"></ion-toggle>
    </ion-item> -->

  <ion-list>
    <ion-item lines="none" *ngFor="let fixtures of fixtures; let i = index;" text-wrap>
      <ion-avatar slot="start">
        <img src="/assets/Badges/icons8-arsenal-fc-480.png" alt="arsenal">
      </ion-avatar>
      <ion-label>
        <h3>{{ getTeamNameStartingAtZeroIndex(i) }}</h3>
        <div class="fixture-elements">
          <span class="fixture-difficulty" *ngFor=" let fixture of fixtures?.slice(0, fixtureRange)" [class]="'fixture-difficulty fixture-difficulty-' + fixture.difficulty"></span>
        </div>
      </ion-label>
    </ion-item>
  </ion-list>

  <ion-list>
  </ion-list>
</ion-content>
