<ion-header translucent="true">
    <ion-toolbar color="tertiary">
        <ion-title text-center>
            Leagues
        </ion-title>
    </ion-toolbar>
</ion-header>

<ion-content padding>
    <ion-list>
        <ion-item *ngFor="let league of leagues" (click)="openLeague(league.id)">
            <ion-label text-wrap>
                <h2>
                    {{ league.name }}
                </h2>
                <p>
                    <ion-note slot="start"> {{ league.playerRank }} </ion-note>
                </p>
            </ion-label>
            <ion-icon (click)="removeLeague(league.id)" slot="end" color="danger" name="close-circle">
            </ion-icon>
        </ion-item>
    </ion-list>

    <ion-fab vertical="bottom" horizontal="end" slot="fixed">
        <ion-fab-button (click)="openAddLeagueModal()">
            <ion-icon name="add"></ion-icon>
        </ion-fab-button>
    </ion-fab>
</ion-content>
