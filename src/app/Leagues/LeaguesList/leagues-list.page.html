<ion-header>
    <ion-toolbar color="primary">
        <ion-title>
            LEAGUES
        </ion-title>
    </ion-toolbar>
</ion-header>

<ion-content padding>
    <ion-list lines="inset" inset>
        <ion-list-header>
            <ion-label>
                MY LEAGUES
            </ion-label>
        </ion-list-header>
        <ion-item *ngFor="let league of leagues" (click)="openLeague(league.id)">
            <ion-label text-wrap>{{ league.name }}</ion-label>
            <ion-icon (click)="
                        removeLeague(league.id)" slot="end" color="danger" name="close-circle">
            </ion-icon>
        </ion-item>
    </ion-list>

    <ion-fab vertical="bottom" horizontal="end" slot="fixed">
        <ion-fab-button (click)="openAddLeagueModal()">
            <ion-icon name="add"></ion-icon>
        </ion-fab-button>
    </ion-fab>
</ion-content>
