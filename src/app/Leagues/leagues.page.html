<app-header [title]="'LEAGUES'"></app-header>

<ion-content padding>
  <ion-list>
    <ion-item *ngFor="let league of leagues" lines="none" (click)="openLeague(league.id)">
      <ion-label text-wrap>
        <h2>
          <strong> {{ league.name }}</strong> - <ion-text color="danger"><strong> {{
              getOrdinalNum(league.playerRank.toLocaleString()) }}</strong></ion-text>
        </h2>
      </ion-label>
      <ion-button (click)="removeLeague(league.id)" shape="round" size="small" color="danger" class="make-transfers__chip"
        slot="end">
        <ion-label>REMOVE</ion-label>
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
