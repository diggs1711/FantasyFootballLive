<ion-header>
  <ion-toolbar>
    <ion-title color="primary">
      Leagues
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="refreshLeague($event)">
    <ion-refresher-content refreshingSpinner="circles" refreshingText="Refreshing..."></ion-refresher-content>
  </ion-refresher>
  <ion-list>
    <ion-list-header>
      <ion-label>
        <h2>My Leagues</h2>
      </ion-label>
    </ion-list-header>
    <ion-item *ngFor="let item of leagues" (click)="leagueSelected(item.id)">
      {{ item.name }}
      <ion-icon (click)="removeLeague(item.id)" slot="end" color="danger" name="close-circle"></ion-icon>
    </ion-item>
  </ion-list>

  <ion-list inset>
    <ion-item>
      <ion-label position="stacked">League Id</ion-label>
      <ion-input placeholder="Enter League Id" [(ngModel)]="leagueId" type="number"></ion-input>
    </ion-item>
    <ion-button expand="block" shape="round" color="primary" fill="outline" (click)="addLeague(leagueId)">
      <ion-ripple-effect></ion-ripple-effect>
      Add
    </ion-button>
  </ion-list>

  <ion-list lines="full">
    <ion-list-header>
      <ion-label>
        <h2>{{ league_name }}</h2>
      </ion-label>
    </ion-list-header>
    <ion-item *ngFor="let item of leaguePlayers" (click)="leaguePlayerSelected(item.entry)">
      <ion-badge color="none" slot="start">{{item.rank}}</ion-badge>
      <ion-label text-wrap>
        <ion-text>
          <h2>{{ item.entry_name }}</h2>
        </ion-text>
        <h3>{{ item.player_name }}</h3>
        <ion-badge color="success">{{ item.chip }}</ion-badge>
        <p> Captain: <strong>{{ item.captain }}</strong>
        </p>
      </ion-label>
      <ion-note slot="end" text-wrap>
        <ion-text>
          <h6>{{ item.total }}</h6>
        </ion-text>
        <p>
          {{ item.event_total }}
        </p>
      </ion-note>
    </ion-item>
  </ion-list>
</ion-content>
