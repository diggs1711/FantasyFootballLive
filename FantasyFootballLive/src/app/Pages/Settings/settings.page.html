<app-header [title]="'TEAM'"></app-header>
<ion-content padding>
  <ion-list>
    <ion-item *ngFor="let entry of form" lines="inset">
      <ion-label>{{entry.val}}</ion-label>
      <ion-checkbox slot="end" [(ngModel)]="entry.isChecked" [checked]="includeBonusPoints" (ionChange)="updateSetting(entry.isChecked)"></ion-checkbox>
    </ion-item>
  </ion-list>
</ion-content>
