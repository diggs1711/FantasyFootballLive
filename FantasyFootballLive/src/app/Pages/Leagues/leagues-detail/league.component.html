<!-- <app-header [title]="'LEAGUE'"></app-header> -->
<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button color="dark" (click)="closeModal()">
        <ion-icon name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-label class="main-logo">LEAGUES</ion-label>
  </ion-toolbar>
</ion-header>
<app-loading-spinner *ngIf="showSpinner"></app-loading-spinner>

<ion-content *ngIf="!showSpinner">
  <ion-refresher slot="fixed" (ionRefresh)="refreshPulldown($event)">
    <ion-refresher-content refreshingSpinner="circles" refreshingText="Refreshing..."></ion-refresher-content>
  </ion-refresher>

  <ion-list class="league__list" *ngIf="league.members.size > 0">
    <ion-list-header>
      <ion-label text-wrap>
        <h2>
          {{ league.name }}
        </h2>
      </ion-label>
    </ion-list-header>

    <ion-item class="league__member" *ngFor="let member of leagueStanding; let i = index;"
      (click)="onPlayerSelected(member.team.id)">
      <ion-avatar slot="start">
        <img [src]="member.countryImage">
      </ion-avatar>
      <ion-label text-wrap>
        <h2>{{ i + 1 }}. {{ member.team.name }}</h2>
        <h3>{{ member.name }}</h3>
        <p>
          {{ member.team.captainName }} (C)
        </p>
        <ion-badge *ngIf="member.activeChip.length > 0" color="danger">{{ member.activeChip }}</ion-badge>
      </ion-label>

      <ion-note class="league__member__details" slot="end">
        <h4>
          {{ member.team.overallPoints }}
        </h4>
        <h6>
          {{ member.team.gameweekPoints }}
        </h6>
      </ion-note>
    </ion-item>
  </ion-list>
</ion-content>
